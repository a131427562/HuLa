name: Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm install --no-frozen-lockfile

      - name: Build APK (arm64, debug-signed so it can be installed directly)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm tauri android build --apk true --debug --target aarch64

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: HuLa-android-apk
          path: out/*.apk
          if-no-files-found: error
