name: Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm install --no-frozen-lockfile

      - name: Skip type-check (upstream has TS errors)
        run: sed -i 's/pnpm build/pnpm vite build/' src-tauri/tauri.android.conf.json && grep -n beforeBuild src-tauri/tauri.android.conf.json

      - name: Build APK (arm64, debug-signed so it can be installed directly)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm tauri android build --apk true --target aarch64

      - name: Collect and sign APK
        run: |
          mkdir -p out
          UNSIGNED=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          echo "unsigned: $UNSIGNED"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          keytool -genkeypair -keystore ks.jks -alias hula -keyalg RSA -keysize 2048 -validity 10000 -storepass hulahula -keypass hulahula -dname "CN=HuLa"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:hulahula --out out/HuLa.apk aligned.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: HuLa-android-apk
          path: out/*.apk
          if-no-files-found: error
