name: Android Crash Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm install --no-frozen-lockfile
      - name: Skip type-check
        run: sed -i 's/pnpm build/pnpm vite build/' src-tauri/tauri.android.conf.json
      - name: Build x86_64 debug APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm tauri android build --apk true --debug --target x86_64
      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android -name "*.apk" -exec cp {} out/app.apk \;
          ls -lh out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb logcat -c
            adb install -r out/app.apk
            adb shell monkey -p com.hula.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > out/logcat.txt
            adb shell pidof com.hula.app > out/pid.txt || echo none > out/pid.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-logs
          path: |
            out/logcat.txt
            out/pid.txt